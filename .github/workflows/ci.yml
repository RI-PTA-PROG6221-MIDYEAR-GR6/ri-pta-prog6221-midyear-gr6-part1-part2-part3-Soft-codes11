
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore
        run: dotnet restore "PROG6221 ALL PARTS/CybersecurityAwarenessBot.sln"

      - name: Build
        run: dotnet build "PROG6221 ALL PARTS/CybersecurityAwarenessBot.sln" --configuration Release --no-restore
